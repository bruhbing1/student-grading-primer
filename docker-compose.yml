services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: marksuser
      POSTGRES_PASSWORD: markspass
      POSTGRES_DB: marksdb
    # Pre-seed script is required as a volume to load mock database
    # Data inside the container is lost on restart unless you persist it with a volume.
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - my_db:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      dockerfile: Dockerfile
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_NAME: marksdb
      DB_USER: marksuser
      DB_PASSWORD: markspass
    depends_on:
      - db

  frontend:
    # TODO: you will need to add to this
    build:
      dockerfile: Dockerfile
      context: ./frontend
    ports: 
      - "80:80"
    depends_on:
      - backend
    
  

  automark:
    build: ./automark
    depends_on:
      - backend
      - db
    profiles:
      - debug

volumes:
  my_db:
